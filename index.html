<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>三虎 Loui Yue｜全栈设计师 · 品牌 / 界面 / VR 展厅</title>
  <meta name="description" content="三虎 Loui Yue，全栈设计师。做过 VR 科技展厅、App、信息可视化海报与企业官网，从品牌、界面到前后端开发，一人负责到底。">
  <meta name="author" content="三虎 Loui Yue">
  <meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1016" media="(prefers-color-scheme: dark)">

  <!-- Open Graph：分享到微信/社交平台时的卡片信息 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="三虎 Loui Yue｜全栈设计师 · 品牌 / 界面 / VR 展厅">
  <meta property="og:description" content="VR 科技展厅、App、信息可视化海报与企业官网，从第一张草图到正式上线。">
  <meta property="og:image" content="assets/img/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!-- 字体：见 AGENTS.md「字体」。国内访问 Google Fonts 较慢时，可换成镜像或本地托管，回退字体已配置好。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
  <!-- 仅为首屏「三虎」两个字加载超粗中文字形（text= 子集，体积很小）。改名时同步修改 text 参数。 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&text=%E4%B8%89%E8%99%8E&display=swap">

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- 在渲染前应用已保存的主题，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <!-- ============ 顶部导航 ============ -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#top" aria-label="三虎 Loui Yue，回到顶部">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="5" y="6" width="5" height="20" rx="1.5" transform="skewX(-14)" />
          <rect x="14" y="6" width="5" height="20" rx="1.5" transform="skewX(-14)" />
          <rect x="23" y="6" width="5" height="20" rx="1.5" transform="skewX(-14)" />
        </svg>
        <span class="brand-text"><span data-bind="nameCn"></span> <span class="brand-en" data-bind="nameEn"></span></span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="主导航">
        <a href="#work">作品</a>
        <a href="#services">服务</a>
        <a href="#experience">经历</a>
        <a href="#about">关于</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深色或浅色模式">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <a class="btn btn-small btn-solid" href="#contact">联系我</a>
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ============ 首屏：设计稿 / 上线版 对比 ============ -->
    <section class="hero" id="top" aria-label="介绍">
      <div class="hero-stage" id="heroStage">
        <div class="hero-layer is-built" id="heroBuilt"></div>
        <div class="hero-layer is-spec" id="heroSpec" aria-hidden="true"></div>
        <div class="split" id="split" role="slider" tabindex="0"
             aria-label="拖动对比设计稿与上线版" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
          <span class="split-line"></span>
          <span class="split-knob">
            <span class="split-label is-left">设计稿</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg>
            <span class="split-label is-right">上线版</span>
          </span>
        </div>
      </div>
    </section>

    <!-- ============ 作品 ============ -->
    <section class="section" id="work" aria-labelledby="workTitle">
      <div class="container">
        <div class="section-head">
          <h2 id="workTitle">作品</h2>
          <p class="section-note" id="workCount"></p>
        </div>
        <div class="filters" id="filters" role="group" aria-label="按类型筛选作品"></div>
        <div class="work-grid" id="workGrid"></div>
        <p class="empty-note" id="workEmpty" hidden>这个分类下还没有作品，选择「全部」查看所有项目。</p>
      </div>
    </section>

    <!-- ============ 服务：全栈层级 ============ -->
    <section class="section section-alt" id="services" aria-labelledby="servicesTitle">
      <div class="container">
        <div class="section-head">
          <h2 id="servicesTitle">从品牌到服务器</h2>
          <p class="section-note">一个项目通常要经过这几层。你可以只找我做其中一层，也可以整个交给我。</p>
        </div>
        <div class="stack" id="stackList"></div>
      </div>
    </section>

    <!-- ============ 企业项目经历 + 合作流程 ============ -->
    <section class="section" id="experience" aria-labelledby="expTitle">
      <div class="container">
        <div class="section-head">
          <h2 id="expTitle">项目经历</h2>
          <p class="section-note">合作过的项目与交付范围，按时间倒序。</p>
        </div>
        <div class="exp-table" id="expList" role="table" aria-label="项目经历"></div>

        <h3 class="sub-title" id="processTitle">合作流程</h3>
        <ol class="process" id="processList" aria-labelledby="processTitle"></ol>
      </div>
    </section>

    <!-- ============ 关于 ============ -->
    <section class="section section-alt" id="about" aria-labelledby="aboutTitle">
      <div class="container about">
        <div class="about-text">
          <h2 id="aboutTitle">关于我</h2>
          <div id="aboutBody"></div>
        </div>
        <dl class="tools" id="toolList" aria-label="常用工具"></dl>
      </div>
    </section>

    <!-- ============ 联系 ============ -->
    <section class="section contact" id="contact" aria-labelledby="contactTitle">
      <div class="container">
        <h2 id="contactTitle">有项目想聊？</h2>
        <p class="contact-note" id="replyNote"></p>
        <div class="contact-mail">
          <a class="mail-link" id="mailLink" href="#"></a>
          <button class="btn btn-ghost" id="copyMail" type="button">复制邮箱</button>
          <span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> <span data-bind="nameCn"></span> <span data-bind="nameEn"></span></p>
      <ul class="socials" id="socials"></ul>
    </div>
  </footer>

  <!-- ============ 项目详情面板（由 #project/<slug> 打开） ============ -->
  <dialog class="panel" id="panel" aria-labelledby="panelTitle">
    <div class="panel-inner" id="panelBody"></div>
  </dialog>

  <noscript>
    <p class="noscript">这个网站需要启用 JavaScript 才能显示内容。也可以直接发邮件到 louiyue@sanhuu.cn。</p>
  </noscript>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
